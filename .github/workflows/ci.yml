name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check hooks/ .ai/ tests/ --select E,F,W --ignore E501

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: python -c "import json; json.load(open('.claude-plugin/plugin.json'))"

      - name: Validate hooks.json
        run: python -c "import json; json.load(open('hooks/hooks.json'))"

      - name: Validate marketplace.json
        run: python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Validate templates/settings.json
        run: python -c "import json; json.load(open('templates/settings.json'))"

  smoke-test-scripts:
    name: Smoke test scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rebuild_db.py
        run: |
          mkdir -p /tmp/smoke-test-proj
          python .ai/rebuild_db.py /tmp/smoke-test-proj

      - name: Run sync_context.py (no context dir)
        run: python .ai/sync_context.py /tmp/smoke-test-proj

      - name: Run intelligence_cli.py status
        run: |
          CLAUDE_PROJECT_DIR=/tmp/smoke-test-proj python .ai/intelligence_cli.py status || true

      - name: Run intelligence_cli.py health
        run: |
          CLAUDE_PROJECT_DIR=/tmp/smoke-test-proj python .ai/intelligence_cli.py health

      - name: Run session_start hook
        run: |
          echo '{}' | CLAUDE_PROJECT_DIR=/tmp/smoke-test-proj python hooks/session_start.py
